<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Cài đặt cửa hàng')}"></head><body><div th:replace="~{fragments/admin-layout :: layout(activeNav='settings', content=~{::#mainContent})}"><div id="mainContent"><div class="ops-heading"><div><p class="ops-eyebrow">MOTORENT / QUẢN LÝ</p><h1>Cài đặt cửa hàng</h1></div></div><div id="ops-error" class="cw-message" role="status" aria-live="polite"></div><form id="live-settings" class="cw-card cw-grid"><label class="cw-field">Tên cửa hàng<input name="name" type="text" step="any" required></label><label class="cw-field">Người đại diện<input name="representative" type="text" step="any" required></label><label class="cw-field">Địa chỉ cửa hàng<input name="address" type="text" step="any" required></label><label class="cw-field">Điện thoại<input name="phone" type="tel" step="any" required></label><label class="cw-field">Email<input name="email" type="email" step="any" required></label><label class="cw-field">Zalo<input name="zalo" type="text" step="any" required></label><label class="cw-field">Giờ mở cửa<input name="hours" type="text" step="any" required></label><label class="cw-field">Vĩ độ<input name="lat" type="number" step="any" required></label><label class="cw-field">Kinh độ<input name="lng" type="number" step="any" required></label><label class="cw-field">Phí giao nhận cơ bản<input name="deliveryBaseFee" type="number" step="any" required></label><label class="cw-field">Khoảng cách cơ bản km<input name="deliveryBaseKm" type="number" step="any" required></label><label class="cw-field">Phí mỗi km phát sinh<input name="deliveryPerKm" type="number" step="any" required></label><label class="cw-field">Bán kính phục vụ km<input name="deliveryMaxKm" type="number" step="any" required></label><label class="cw-field">Thời gian giữ chỗ phút<input name="holdMinutes" type="number" step="any" required></label><label class="cw-field">Phần trăm cọc thuê xe<input name="depositPercent" type="number" step="any" required></label><label class="cw-field cw-full">Điều khoản bổ sung<textarea name="terms" rows="6" maxlength="4000"></textarea></label><button class="cw-btn primary">Lưu cấu hình</button></form></div></div></body></html>
