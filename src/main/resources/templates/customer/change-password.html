<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" class="h-full">
<head th:replace="~{fragments/head :: head(title='Đổi mật khẩu')}"></head>
<body class="bg-surface text-on-surface font-sans antialiased selection:bg-primary-container selection:text-on-primary-container relative flex flex-col min-h-screen">
  
  <div th:replace="~{fragments/customer-header :: header(isHome=false, activeNav='profile')}"></div>

  <main class="pt-24 pb-20 flex-grow">
    <div class="max-w-[1024px] mx-auto px-margin-sm md:px-margin">
      <div class="mb-8">
        <h1 class="text-headline-md font-bold text-white mb-2">Hồ sơ cá nhân</h1>
        <p class="text-secondary">Quản lý thông tin tài khoản và bảo mật.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Sidebar -->
        <div class="md:col-span-1 space-y-2">
          <a th:href="@{/customer/profile}" class="block px-4 py-3 rounded-xl hover:bg-surface-container text-secondary hover:text-white transition-all">
             Thông tin chung
          </a>
          <a th:href="@{/customer/edit-profile}" class="block px-4 py-3 rounded-xl hover:bg-surface-container text-secondary hover:text-white transition-all">
             Cập nhật hồ sơ
          </a>
          <a th:href="@{/customer/change-password}" class="block px-4 py-3 rounded-xl bg-primary/20 text-primary border border-primary/30 font-bold transition-all">
             Đổi mật khẩu
          </a>
        </div>

        <!-- Main Content -->
        <div class="md:col-span-3">
          <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-white/5 max-w-xl">
            <h2 class="text-headline-sm font-bold text-white mb-6">Đổi mật khẩu</h2>
            
            <form th:action="@{/customer/profile}" method="get" class="space-y-6">
              
              <div>
                <label class="block text-xs font-semibold text-secondary uppercase tracking-wider mb-2">Mật khẩu hiện tại</label>
                <input type="password" class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
              </div>

              <div>
                <label class="block text-xs font-semibold text-secondary uppercase tracking-wider mb-2">Mật khẩu mới</label>
                <input type="password" class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
              </div>

              <div>
                <label class="block text-xs font-semibold text-secondary uppercase tracking-wider mb-2">Xác nhận mật khẩu mới</label>
                <input type="password" class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
              </div>

              <div class="pt-4 flex gap-3">
                 <button type="submit" class="py-3 px-6 rounded-xl font-bold bg-primary-container text-on-primary hover:bg-inverse-primary transition-all">Cập nhật mật khẩu</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/customer-footer :: footer}"></div>
</body>
</html>
