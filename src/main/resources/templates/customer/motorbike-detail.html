<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Chi tiết xe')}"></head><body class="bg-surface text-on-surface"><div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div><main class="customer-workspace"><div class="cw-tabs"><a href="/customer/my-rentals">Đơn đang thuê</a><a href="/customer/rental-history">Lịch sử</a><a href="/customer/profile">Hồ sơ cá nhân</a></div><h1>Chi tiết xe</h1><div id="cw-message" class="cw-message" role="status" aria-live="polite"></div><div class="cw-specs"><section class="cw-card"><img class="cw-hero-image" id="bike-image" th:src="${display.image(motorbike.imagePrimary)}" th:alt="${motorbike.name}"><div class="cw-gallery"><button th:each="url : ${motorbike.allImages}" type="button" data-gallery><img th:src="${display.image(url)}" alt="Ảnh xe"></button></div></section><section class="cw-card"><p class="cw-muted" th:text="${motorbike.brand + ' · ' + motorbike.category}"></p><h2 th:text="${motorbike.name}"></h2><div class="cw-price" th:text="${display.money(motorbike.pricePerDay) + ' / ngày'}"></div><div class="cw-facts"><span th:text="${'Đời xe: '+motorbike.year}"></span><span th:text="${'Dung tích: '+motorbike.cc+' cc'}"></span><span th:text="${'Đánh giá: '+motorbike.rating+' / 5'}"></span><span th:text="${motorbike.reviewCount+' đánh giá'}"></span><span th:text="${motorbike.transmission}"></span><span th:text="${display.status(motorbike.status)}"></span></div><p class="cw-muted" th:text="${motorbike.description}"></p><p th:text="${motorbike.highlights}"></p><div class="cw-actions"><a class="cw-btn primary" data-preserve-query th:unless="${motorbike.status == 'MAINTENANCE' || motorbike.status == 'UNAVAILABLE'}" th:href="@{/customer/rental-contract/{id}(id=${motorbike.id})}">Chọn thời gian và đặt xe</a><a class="cw-btn" href="/customer/motorbike-list">Xem xe khác</a></div></section></div><section class="cw-card"><h2>Đánh giá từ khách thuê</h2><p th:if="${#lists.isEmpty(bikeReviews)}" class="cw-muted">Chưa có đánh giá cho xe này.</p><div th:each="r : ${bikeReviews}" style="padding:14px 0;border-bottom:1px solid #ffffff18"><strong th:text="${r.rating + ' / 5'}"></strong><p th:text="${r.comment}"></p><p class="cw-muted" th:if="${r.staffReply != null}" th:text="${'Phản hồi cửa hàng: '+r.staffReply}"></p></div></section></main><div th:replace="~{fragments/customer-footer :: footer}"></div><script src="/js/customer.js" defer></script></body></html>
