<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Danh sách xe')}"></head><body class="bg-surface text-on-surface"><div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div><main class="customer-workspace catalog-page"><p class="cw-message" role="alert" th:if="${searchError!=null}" th:text="${searchError}"></p><div class="catalog-title"><p class="fleet-eyebrow">MOTORENT ĐÀ NẴNG</p><h1>Chọn xe cho hành trình của bạn</h1><p class="cw-muted">Chọn lịch và điểm nhận xe để kiểm tra danh mục còn trống.</p></div>
<form id="catalog-search" method="get"><div class="catalog-booking"><div class="catalog-booking-fields"><label class="cw-field"><span>◷ NGÀY &amp; GIỜ NHẬN XE</span><input type="datetime-local" name="pickup" th:value="${pickup}"></label><label class="cw-field"><span>◷ NGÀY &amp; GIỜ TRẢ XE</span><input type="datetime-local" name="returnAt" th:value="${returnAt}"></label><label class="cw-field"><span>⌖ ĐỊA ĐIỂM NHẬN XE</span><select id="pickupLocation" name="location"><option value="store" th:selected="${location=='store'}">Nhận xe tại cửa hàng (miễn phí)</option><option value="maps_delivery" th:selected="${location!='store'}">Chọn điểm giao trên bản đồ</option></select></label><button class="cw-btn primary" type="submit">⌕ Kiểm tra xe trống</button></div><div class="catalog-booking-note"><span th:text="${pickup!=null and returnAt!=null ? 'Đã kiểm tra: '+#lists.size(motorbikes)+' xe phù hợp với lịch thuê.' : 'Chọn cả ngày nhận và ngày trả để kiểm tra lịch trống.'}"></span><button type="button" class="catalog-map-link" onclick="openMapModal()">Chọn vị trí giao xe</button></div><p id="currentDeliveryAddressText" class="cw-muted" th:text="${deliveryAddress}"></p></div>
<input id="prefilledAddress" type="hidden" name="deliveryAddress" th:value="${deliveryAddress}"><input id="prefilledLat" type="hidden" name="deliveryLat" th:value="${deliveryLat}"><input id="prefilledLng" type="hidden" name="deliveryLng" th:value="${deliveryLng}">
<div class="catalog-tabs" role="group" aria-label="Loại xe"><button type="submit" name="category" value="all" th:classappend="${category=='all'?'active':''}">Tất cả xe</button><button type="submit" name="category" value="xe-ga" th:classappend="${category=='xe-ga'?'active':''}">Xe ga</button><button type="submit" name="category" value="xe-so" th:classappend="${category=='xe-so'?'active':''}">Xe số</button><button type="submit" name="category" value="xe-con-tay" th:classappend="${category=='xe-con-tay'?'active':''}">Xe côn tay</button></div>
<div class="catalog-filters"><input name="keyword" th:value="${keyword}" placeholder="Tìm tên xe…" aria-label="Tên xe"><select name="priceFilter" aria-label="Giá thuê"><option value="all">Mức giá: Tất cả</option><option value="under120" th:selected="${priceFilter=='under120'}">Dưới 120.000 ₫</option><option value="120to180" th:selected="${priceFilter=='120to180'}">120.000–180.000 ₫</option><option value="above180" th:selected="${priceFilter=='above180'}">Trên 180.000 ₫</option></select><select name="ccFilter" aria-label="Dung tích"><option value="all">Dung tích: Tất cả</option><option th:each="cc : ${ccOptions}" th:value="${cc}" th:text="${cc+' cc'}" th:selected="${ccFilter==#strings.toString(cc)}"></option></select><select name="statusFilter" aria-label="Trạng thái"><option value="all">Trạng thái: Tất cả</option><option value="available" th:selected="${statusFilter=='available'}">Sẵn sàng</option></select><select name="sortBy" aria-label="Sắp xếp"><option value="popular">Đánh giá cao</option><option value="price-asc" th:selected="${sortBy=='price-asc'}">Giá tăng dần</option><option value="price-desc" th:selected="${sortBy=='price-desc'}">Giá giảm dần</option><option value="newest" th:selected="${sortBy=='newest'}">Đời xe mới</option></select><button class="cw-btn" type="submit">Lọc xe</button></div><input type="hidden" id="current-category" th:value="${category}"></form><p class="cw-muted" th:text="${#lists.size(motorbikes)+' xe phù hợp'}"></p><p class="cw-card" th:if="${#lists.isEmpty(motorbikes)}">Không có xe phù hợp. Hãy thử lịch hoặc bộ lọc khác.</p><div class="bike-catalog-grid"><article class="cw-card bike-card" th:each="m : ${motorbikes}"><img class="cw-hero-image" style="height:210px" th:src="${display.image(m.imagePrimary)}" th:alt="${m.name}"><p class="cw-muted" th:text="${m.brand+' · '+m.category}"></p><h2 th:text="${m.name}"></h2><div class="cw-row"><span class="cw-price" th:text="${display.money(m.pricePerDay)+' / ngày'}"></span><span class="cw-tag" th:text="${display.status(m.status)}"></span></div><div class="cw-facts"><span th:text="${m.cc+' cc · '+m.year}"></span><span th:text="${m.rating+' / 5 · '+m.reviewCount+' đánh giá'}"></span></div><a class="cw-btn primary" data-preserve-query th:href="@{/customer/motorbike-detail/{id}(id=${m.id})}">Xem chi tiết</a></article></div></main><div th:replace="~{fragments/map-modal :: mapModal}"></div><div th:replace="~{fragments/customer-footer :: footer}"></div><script src="/js/customer.js" defer></script><script src="/js/booking-search.js" defer></script></body></html>
