<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Yêu cầu gia hạn')}"></head><body class="bg-surface text-on-surface"><div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div><main class="customer-workspace"><div class="cw-tabs"><a href="/customer/my-rentals">Đơn đang thuê</a><a href="/customer/rental-history">Lịch sử</a><a href="/customer/profile">Hồ sơ cá nhân</a></div><h1>Yêu cầu gia hạn</h1><div id="cw-message" class="cw-message" role="status" aria-live="polite"></div><section class="cw-card"><div class="cw-row"><h2 th:text="${rental.orderCode}"></h2><span class="cw-tag" th:text="${display.status(rental.status)}"></span></div><div class="cw-order"><img th:src="${display.image(rental.motorbike.imagePrimary)}" th:alt="${rental.motorbike.name}"><div><h2 th:text="${rental.motorbike.name}"></h2><span class="cw-price" th:text="${display.money(rental.totalPrice)}"></span><div class="cw-facts"><span th:text="${'Nhận: '+display.date(rental.pickupDate)}"></span><span th:text="${'Trả: '+display.date(rental.returnDate)}"></span><span th:text="${'Đã trả: '+display.money((rental.depositPaid ?: 0)+(rental.balancePaid ?: 0))}"></span><span th:text="${'Còn lại: '+display.money(rental.totalPrice-(rental.depositPaid ?: 0)-(rental.balancePaid ?: 0))}"></span></div><p class="cw-muted" th:text="${rental.pickupAddress ?: 'Nhận tại cửa hàng'}"></p><p class="cw-muted" th:text="${rental.returnAddress ?: 'Trả tại cửa hàng'}"></p><p th:if="${rental.rejectionReason != null}" th:text="${rental.rejectionReason}"></p></div></div></section><section class="cw-card"><form id="extension-form" th:data-id="${rental.id}" class="cw-grid"><label class="cw-field">Ngày trả mới<input type="datetime-local" name="newReturnDate" step="1" required th:min="${rental.returnDate}"></label><label class="cw-field">Lý do<textarea name="reason" maxlength="1000" required></textarea></label><p class="cw-muted cw-full">Cửa hàng sẽ kiểm tra lịch xe và duyệt yêu cầu. Phí phát sinh tính theo giá ngày đã chốt trong đơn; gửi yêu cầu hoặc được duyệt chưa có nghĩa là được gia hạn. Ngày trả chỉ thay đổi sau khi thanh toán PayOS thành công.</p><button class="cw-btn primary">Gửi yêu cầu</button></form></section></main><div th:replace="~{fragments/customer-footer :: footer}"></div><script src="/js/customer.js" defer></script></body></html>
