<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Hồ sơ cá nhân')}"></head><body class="bg-surface text-on-surface"><div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div><main class="customer-workspace"><div class="cw-tabs"><a href="/customer/my-rentals">Đơn đang thuê</a><a href="/customer/rental-history">Lịch sử</a><a href="/customer/profile">Hồ sơ cá nhân</a></div><h1>Hồ sơ cá nhân</h1><div id="cw-message" class="cw-message" role="status" aria-live="polite"></div><p class="cw-muted">Cập nhật thông tin liên hệ và bảo mật tài khoản của bạn.</p><section class="cw-card"><div class="cw-row"><h2>Thông tin cá nhân</h2><img class="cw-avatar" th:src="${display.image(customer.avatar)}" alt="Ảnh đại diện"></div><form id="avatar-form" class="cw-actions"><input type="file" name="file" accept="image/jpeg,image/png" required aria-label="Ảnh đại diện JPG hoặc PNG"><button class="cw-btn">Lưu ảnh đại diện</button></form><form id="account-form" class="cw-grid" style="margin-top:24px"><label class="cw-field">Tên<input name="firstName" type="text" required maxlength="100" th:value="${customer.firstName}"></label><label class="cw-field">Họ và tên đệm<input name="lastName" type="text" required maxlength="100" th:value="${customer.lastName}"></label><label class="cw-field">Email<input name="email" type="email" required th:value="${customer.email}"></label><label class="cw-field">Số điện thoại<input name="phone" type="tel" required th:value="${customer.phone}"></label><label class="cw-field">Ngày sinh<input name="birthDate" type="date"  th:value="${customer.birthDate}"></label><label class="cw-field">Địa chỉ<input name="address" type="text" maxlength="255" th:value="${customer.address}"></label><label class="cw-field">Giới tính<select name="gender"><option value="" th:selected="${customer.gender == null}">Chưa cung cấp</option><option value="true" th:selected="${customer.gender == true}">Nam</option><option value="false" th:selected="${customer.gender == false}">Nữ</option></select></label><div class="cw-actions"><button class="cw-btn primary">Lưu thông tin</button></div></form></section><section class="cw-card"><h2>Đổi mật khẩu</h2><form id="password-form" class="cw-grid"><label class="cw-field">Mật khẩu hiện tại<input name="currentPassword" type="password" required minlength="8" maxlength="72" autocomplete="current-password"></label><label class="cw-field">Mật khẩu mới<input name="newPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><label class="cw-field">Nhập lại mật khẩu mới<input name="confirmPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><div class="cw-actions"><button class="cw-btn primary">Cập nhật mật khẩu</button></div></form></section></main><div th:replace="~{fragments/customer-footer :: footer}"></div><script src="/js/customer.js" defer></script></body></html>
