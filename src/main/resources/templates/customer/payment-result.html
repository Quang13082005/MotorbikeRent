<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Trạng thái thanh toán')}"></head><body class="bg-surface text-on-surface"><div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div><main class="customer-workspace"><div class="cw-tabs"><a href="/customer/my-rentals">Đơn đang thuê</a><a href="/customer/rental-history">Lịch sử</a><a href="/customer/profile">Hồ sơ cá nhân</a></div><h1>Trạng thái thanh toán</h1><div id="cw-message" class="cw-message" role="status" aria-live="polite"></div><section class="cw-card"><div class="cw-row"><h2 th:text="${rental.orderCode}"></h2><span class="cw-tag" th:text="${display.status(rental.status)}"></span></div><div class="cw-order"><img th:src="${display.image(rental.motorbike.imagePrimary)}" th:alt="${rental.motorbike.name}"><div><h2 th:text="${rental.motorbike.name}"></h2><span class="cw-price" th:text="${display.money(rental.totalPrice)}"></span><div class="cw-facts"><span th:text="${'Nhận: '+display.date(rental.pickupDate)}"></span><span th:text="${'Trả: '+display.date(rental.returnDate)}"></span><span th:text="${'Đã trả: '+display.money((rental.depositPaid ?: 0)+(rental.balancePaid ?: 0))}"></span><span th:text="${'Còn lại: '+display.money(rental.remainingRentalAmount)}"></span></div><p class="cw-muted" th:text="${rental.pickupAddress ?: 'Nhận tại cửa hàng'}"></p><p class="cw-muted" th:text="${rental.returnAddress ?: 'Trả tại cửa hàng'}"></p><p th:if="${rental.rejectionReason != null}" th:text="${rental.rejectionReason}"></p></div></div></section><p class="cw-message">Trạng thái được cập nhật sau khi đối soát giao dịch. Nếu vừa chuyển tiền, hãy kiểm tra lại thanh toán.</p><div class="cw-actions"><button class="cw-btn primary" data-action="reconcile" th:data-id="${rental.id}">Kiểm tra lại thanh toán</button><a class="cw-btn" th:href="@{/customer/rental-detail/{id}(id=${rental.id})}">Chi tiết đơn và đổi xe</a><a class="cw-btn" href="/customer/my-rentals">Đơn thuê của tôi</a></div><section class="cw-card"><h2>Giao dịch thanh toán</h2><p class="cw-muted" th:if="${#lists.isEmpty(payments)}">Chưa có giao dịch được lưu.</p><div class="cw-scroll"><table class="cw-table" th:unless="${#lists.isEmpty(payments)}"><thead><tr><th>Số tiền</th><th>Hình thức</th><th>Trạng thái</th><th>Thời điểm nhận</th></tr></thead><tbody><tr th:each="p : ${payments}"><td th:text="${display.money(p.amount)}"></td><td th:text="${p.method == 'PAYOS' ? 'PayOS' : (p.method == 'BANK_TRANSFER' ? 'Chuyển khoản ngân hàng' : 'Tiền mặt')}"></td><td th:text="${p.status == 'PAID' and p.direction == 'OUT' ? 'Đã hoàn tiền' : display.status(p.status)}"></td><td th:text="${display.date(p.paidAt)}"></td></tr></tbody></table></div></section></main><div th:replace="~{fragments/customer-footer :: footer}"></div><script src="/js/customer.js" defer></script></body></html>
