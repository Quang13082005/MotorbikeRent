<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(title='Thông tin cửa hàng và điều khoản thuê xe')}"></head>
<body class="bg-surface text-on-surface">
<div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div>
<main class="customer-workspace">
  <h1 th:text="${shop.name}"></h1>
  <section class="cw-card">
    <h2>Thông tin cửa hàng</h2>
    <p th:text="${shop.address}"></p>
    <p th:text="${'Giờ mở cửa: '+shop.hours}"></p>
    <div class="cw-actions"><a class="cw-btn" th:href="${'tel:'+shop.phone}" th:text="${shop.phone}"></a><a class="cw-btn" th:href="${'mailto:'+shop.email}" th:text="${shop.email}"></a></div>
  </section>
  <section class="cw-card" id="terms">
    <h2>Điều khoản thuê xe</h2>
    <p style="white-space:pre-wrap" th:if="${!#strings.isEmpty(shop.terms)}" th:text="${shop.terms}"></p>
    <p th:if="${#strings.isEmpty(shop.terms)}">Cửa hàng chưa cập nhật điều khoản thuê xe. Vui lòng liên hệ cửa hàng trước khi đặt thuê.</p>
  </section>
  <section class="cw-card">
    <h2>Thanh toán giữ xe</h2>
    <p th:text="${'Khoản giữ xe: '+shop.depositPercent+'% tiền thuê, cộng phí giao nhận nếu có.'}"></p>
    <p th:text="${'Thời hạn thanh toán giữ xe: '+shop.holdMinutes+' phút kể từ khi tạo đơn.'}"></p>
    <p>Khoản bảo đảm tài sản được hiển thị riêng theo xe và phương án đã chọn trong bảng giá trước khi xác nhận.</p>
  </section>
</main>
<div th:replace="~{fragments/customer-footer :: footer}"></div>
</body></html>
