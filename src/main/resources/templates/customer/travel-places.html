<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(title='Gợi ý điểm đến')}"></head>
<body class="bg-surface text-on-surface">
<div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div>
<main class="customer-workspace">
 <h1>Gợi ý điểm đến</h1><p class="cw-muted">Danh mục do cửa hàng cập nhật. Kiểm tra giờ mở cửa và điều kiện đi lại trước khi khởi hành.</p>
 <form class="cw-filter" action="/customer/travel-places" method="get"><label class="cw-field">Tên địa điểm hoặc khu vực<input name="query" th:value="${query}" maxlength="255"></label><button class="cw-btn primary">Tìm địa điểm</button><a class="cw-btn" href="/customer/travel-places">Xem tất cả</a></form>
 <p class="cw-muted" th:text="${placePage.totalElements+' địa điểm'}"></p>
 <p class="cw-card" th:if="${#lists.isEmpty(places)}">Chưa có địa điểm phù hợp.</p>
 <div class="cw-grid"><article class="cw-card" th:each="p : ${places}">
  <img th:if="${p.safeImageUrl != null}" th:src="${p.safeImageUrl}" th:alt="${p.name}" class="cw-hero-image" style="height:200px" loading="lazy" referrerpolicy="no-referrer">
  <p class="cw-muted" th:text="${p.area}"></p><h2 th:text="${p.name}"></h2><p th:text="${p.address}"></p><p style="white-space:pre-wrap" th:text="${p.description}"></p>
  <p class="cw-muted" th:if="${p.safeImageUrl!=null and !#strings.isEmpty(p.imageCredit)}"><span th:text="${p.imageCredit}"></span> · <a th:if="${p.safeImageSourceUrl!=null}" th:href="${p.safeImageSourceUrl}" target="_blank" rel="noopener noreferrer">Nguồn ảnh</a> · <a th:if="${p.safeImageLicenseUrl!=null}" th:href="${p.safeImageLicenseUrl}" target="_blank" rel="noopener noreferrer">Giấy phép</a></p><p class="cw-muted" th:if="${!#strings.isEmpty(p.reviewedAt)}" th:text="${'Thông tin nguồn: '+p.reviewedAt}"></p>
  <a th:if="${p.safeMapsUrl != null}" class="cw-btn" th:href="${p.safeMapsUrl}" target="_blank" rel="noopener noreferrer">Xem trên bản đồ</a>
 </article></div>
<nav class="cw-actions" aria-label="Trang địa điểm"><a class="cw-btn" th:if="${placePage.hasPrevious()}" th:href="@{/customer/travel-places(query=${query},page=${placePage.number-1})}">← Trang trước</a><span th:text="${'Trang '+(placePage.number+1)+' / '+(placePage.totalPages==0?1:placePage.totalPages)}"></span><a class="cw-btn" th:if="${placePage.hasNext()}" th:href="@{/customer/travel-places(query=${query},page=${placePage.number+1})}">Trang sau →</a></nav></main><div th:replace="~{fragments/customer-footer :: footer}"></div>
</body></html>
