<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" class="h-full">
<head th:replace="~{fragments/head :: head(title='Thanh toán')}"></head>
<body class="bg-surface text-on-surface font-sans antialiased selection:bg-primary-container selection:text-on-primary-container relative flex flex-col min-h-screen">
  
  <div th:replace="~{fragments/customer-header :: header(isHome=false, activeNav='my-rentals')}"></div>

  <main class="pt-24 pb-20 flex-grow">
    <div class="max-w-3xl mx-auto px-margin-sm md:px-margin">
      <div class="mb-8">
        <h1 class="text-headline-md font-bold text-white mb-2">Thanh toán cọc</h1>
        <p class="text-secondary">Đơn hàng [[${rental.orderCode}]]</p>
      </div>

      <div class="glass-panel p-6 sm:p-10 rounded-3xl border border-white/5 shadow-glass">
        
        <div class="flex justify-between items-center mb-8 pb-6 border-b border-white/5">
          <div>
            <div class="text-sm text-secondary mb-1">Số tiền cần thanh toán</div>
            <div class="text-3xl font-bold text-primary">396.000đ</div>
          </div>
          <div class="text-right hidden sm:block">
            <div class="text-sm text-secondary mb-1">Thời gian giữ đơn</div>
            <div class="text-xl font-bold text-error flex items-center justify-end gap-1">
              <span class="material-symbols-outlined text-[20px]">timer</span> 14:59
            </div>
          </div>
        </div>

        <h3 class="text-label-lg font-bold text-white mb-4">Phương thức thanh toán</h3>
        
        <form th:action="@{/customer/payment-result}" method="get" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- VNPAY -->
            <label class="relative p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer flex flex-col gap-3">
              <input type="radio" name="method" value="vnpay" checked class="absolute top-4 right-4 text-primary focus:ring-primary border-white/20 bg-surface-container">
              <div class="h-8">
                <!-- Mock logo -->
                <span class="font-bold text-blue-400 text-lg">VNPAY</span>
              </div>
              <div>
                <div class="font-bold text-white text-sm">Cổng VNPAY</div>
                <div class="text-xs text-secondary mt-1">ATM, Visa, Master, QR Code</div>
              </div>
            </label>

            <!-- MoMo -->
            <label class="relative p-4 rounded-xl border-2 border-white/5 bg-surface-container hover:bg-surface-container-high cursor-pointer flex flex-col gap-3 transition-colors">
              <input type="radio" name="method" value="momo" class="absolute top-4 right-4 text-primary focus:ring-primary border-white/20 bg-surface-container">
              <div class="h-8">
                <span class="font-bold text-pink-500 text-lg">MoMo</span>
              </div>
              <div>
                <div class="font-bold text-white text-sm">Ví MoMo</div>
                <div class="text-xs text-secondary mt-1">Quét mã QR qua ứng dụng</div>
              </div>
            </label>
            
          </div>

          <div class="pt-6">
             <button type="submit" class="w-full py-4 rounded-xl font-bold text-on-primary bg-primary-container hover:bg-inverse-primary transition-all shadow-glow-orange-sm flex justify-center items-center gap-2">
               Xác nhận thanh toán
               <span class="material-symbols-outlined">arrow_forward</span>
             </button>
             <p class="text-center text-xs text-secondary mt-4">Bằng việc thanh toán, bạn đồng ý với các chính sách của MotoRent Đà Nẵng.</p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/customer-footer :: footer}"></div>
</body>
</html>
