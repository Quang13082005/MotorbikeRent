<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(title='Thông báo')}"></head>
<body class="bg-surface text-on-surface">
<div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div>
<main class="customer-workspace">
  <h1>Thông báo</h1><p class="cw-muted">100 cập nhật gần nhất về đơn thuê của bạn.</p>
  <section class="cw-card" th:if="${#lists.isEmpty(notifications)}"><p>Bạn chưa có thông báo.</p></section>
  <article class="cw-card" th:each="notice : ${notifications}">
    <div class="cw-row"><h2 th:text="${notice.title}"></h2><span th:if="${notice.isRead != true}" class="cw-muted">Chưa đọc</span></div>
    <p th:text="${notice.message}"></p><p class="cw-muted" th:text="${display.date(notice.createdAt)}"></p>
    <div class="cw-actions">
      <a class="cw-btn" th:if="${notice.link != null and #strings.startsWith(notice.link, '/customer/rental-detail/')}" th:href="${notice.link}">Xem đơn thuê</a>
      <form th:if="${notice.isRead != true}" th:action="@{/customer/notifications/{id}/read(id=${notice.id})}" method="post"><button class="cw-btn">Đánh dấu đã đọc</button></form>
    </div>
  </article>
</main>
<div th:replace="~{fragments/customer-footer :: footer}"></div>
</body></html>
