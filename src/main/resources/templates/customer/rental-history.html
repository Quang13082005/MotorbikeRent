<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="vi"><head th:replace="~{fragments/head :: head(title='Lịch sử thuê xe')}"></head><body class="bg-surface text-on-surface"><div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div><main class="customer-workspace"><div class="cw-tabs"><a href="/customer/my-rentals">Đơn đang thuê</a><a href="/customer/rental-history">Lịch sử</a><a href="/customer/profile">Hồ sơ cá nhân</a></div><h1>Lịch sử thuê xe</h1><div id="cw-message" class="cw-message" role="status" aria-live="polite"></div><p class="cw-muted">Xem lại chuyến đi đã hoàn tất và các đơn đã hủy hoặc từ chối.</p><div class="cw-tabs"><span th:text="${'Tất cả: '+totalHistoryCount}"></span><span th:text="${'Hoàn tất: '+completedCount}"></span><span th:text="${'Hủy hoặc từ chối: '+cancelledCount}"></span></div><form class="cw-filter" method="get"><input name="q" th:value="${q}" placeholder="Tìm theo mã đơn hoặc tên xe" aria-label="Tìm đơn"><select name="status" aria-label="Trạng thái"><option value="ALL">Tất cả</option><option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Hoàn tất</option><option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Đã hủy hoặc từ chối</option></select><select name="months" aria-label="Thời gian"><option value="0">Tất cả thời gian</option><option value="3" th:selected="${months == 3}">3 tháng gần nhất</option><option value="6" th:selected="${months == 6}">6 tháng gần nhất</option></select><button class="cw-btn primary">Lọc lịch sử</button></form><div th:if="${#lists.isEmpty(rentals)}" class="cw-card"><h2>Chưa có đơn thuê phù hợp</h2><a class="cw-btn primary" href="/customer/motorbike-list">Chọn xe</a></div>
<article class="cw-card" th:each="rental : ${rentals}"><div class="cw-row"><strong th:text="${rental.orderCode}"></strong><span class="cw-tag" th:text="${display.status(rental.status)}"></span></div><div class="cw-order"><img th:src="${display.image(rental.motorbike.imagePrimary)}" th:alt="${rental.motorbikeName}"><div><h2 th:text="${rental.motorbikeName}"></h2><span class="cw-price" th:text="${display.money(rental.totalPrice)}"></span><div class="cw-facts"><span th:text="${'Nhận: ' + display.date(rental.pickupDate)}"></span><span th:text="${'Trả: ' + display.date(rental.returnDate)}"></span><span th:text="${rental.days + ' ngày'}"></span><span th:text="${'Đã trả: ' + display.money((rental.depositPaid ?: 0) + (rental.balancePaid ?: 0))}"></span></div><p class="cw-muted" th:if="${rental.rejectionReason != null}" th:text="${rental.rejectionReason}"></p></div></div><div class="cw-actions"><a class="cw-btn" th:href="@{/customer/rental-detail/{id}(id=${rental.id})}">Xem chi tiết</a><button class="cw-btn primary" th:if="${rental.status == 'PENDING_PAYMENT'}" data-action="pay" th:data-id="${rental.id}">Thanh toán cọc</button><button class="cw-btn" th:if="${rental.status == 'PENDING_PAYMENT' || rental.status == 'PENDING'}" data-action="cancel" th:data-id="${rental.id}">Hủy đơn</button><a class="cw-btn" th:if="${rental.status == 'HANDED_OVER' || rental.status == 'EXTENDED'}" th:href="@{/customer/rental-extension/{id}(id=${rental.id})}">Yêu cầu gia hạn</a><a class="cw-btn" th:if="${rental.status == 'COMPLETED' || rental.status == 'CANCELLED' || rental.status == 'REJECTED'}" th:href="@{/customer/motorbike-detail/{id}(id=${rental.motorbike.id})}">Thuê lại xe này</a></div><p class="cw-muted" th:if="${rental.status == 'PENDING_PAYMENT' && rental.paymentExpiresAt != null}" th:text="${'Hạn thanh toán: '+display.date(rental.paymentExpiresAt)}"></p></article><div class="cw-row"><span th:text="${total + ' đơn · Trang ' + (page+1) + '/' + pages}"></span><div class="cw-actions"><a class="cw-btn" th:if="${page>0}" th:href="@{/customer/rental-history(page=${page-1},status=${status},q=${q},months=${months})}">Trang trước</a><a class="cw-btn" th:if="${page+1<pages}" th:href="@{/customer/rental-history(page=${page+1},status=${status},q=${q},months=${months})}">Trang sau</a></div></div></main><div th:replace="~{fragments/customer-footer :: footer}"></div><script src="/js/customer.js" defer></script></body></html>
