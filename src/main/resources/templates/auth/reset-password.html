<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" class="h-full">
<head th:replace="~{fragments/head :: head(title='Đặt lại mật khẩu')}"></head>
<body class="h-full bg-surface text-on-surface font-sans antialiased flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container relative">
  <div class="absolute inset-x-0 top-0 h-96 radial-glow pointer-events-none z-0"></div>

  <div th:replace="~{fragments/customer-header :: header(isHome=false)}"></div>

  <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4 relative z-10">
    <div class="w-full max-w-[500px]">
      <div class="glass-panel p-8 sm:p-10 rounded-3xl border border-white/5 shadow-glass relative overflow-hidden">
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="mb-8">
          <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-tight flex items-center gap-2">
            Mật khẩu mới 🔑
          </h2>
          <p class="text-sm text-secondary mt-2 font-normal leading-relaxed">
            Vui lòng nhập mật khẩu mới của bạn bên dưới.
          </p>
        </div>

        <form class="space-y-4" id="reset-password-form">
          <!-- Mã xác thực do máy chủ kiểm tra -->
          <div>
            <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="code">
              Mã xác nhận (OTP)
            </label>
            <input type="text" id="code" placeholder="Nhập mã 6 số" required
                   class="w-full px-4 py-3 bg-surface-container-lowest/50 border border-white/10 rounded-xl text-on-surface text-sm placeholder:text-secondary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="new_password">
              Mật khẩu mới
            </label>
            <input type="password" minlength="8" maxlength="72" id="new_password" placeholder="Mật khẩu (tối thiểu 8 ký tự)" required
                   class="w-full px-4 py-3 bg-surface-container-lowest/50 border border-white/10 rounded-xl text-on-surface text-sm placeholder:text-secondary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="confirm_password">
              Xác nhận mật khẩu
            </label>
            <input type="password" id="confirm_password" placeholder="Nhập lại mật khẩu" required
                   class="w-full px-4 py-3 bg-surface-container-lowest/50 border border-white/10 rounded-xl text-on-surface text-sm placeholder:text-secondary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
          </div>

          <button type="submit" id="btn-submit" class="w-full mt-4 py-3.5 px-6 rounded-xl font-bold text-on-primary bg-gradient-to-r from-primary-container to-inverse-primary hover:from-primary hover:to-primary-container text-sm uppercase tracking-wider shadow-glow-orange-sm hover:shadow-glow-orange-lg hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
            <span>Đổi mật khẩu &amp; Đăng nhập</span>
          </button>
        </form>
      </div>
    </div>
  </main>
  
  <script>
    // Lấy thông tin từ URL
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    const otpCodeParam = urlParams.get('otpCode');
    
    if (otpCodeParam) {
        document.getElementById('code').value = otpCodeParam;
    }

    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const code = document.getElementById('code').value;
        const newPassword = document.getElementById('new_password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (newPassword !== confirmPassword) {
            alert('Mật khẩu không khớp!');
            return;
        }

        const btn = document.getElementById('btn-submit');
        const originalText = btn.innerHTML;
        btn.innerHTML = 'ĐANG ĐỔI MẬT KHẨU...';
        btn.disabled = true;

        fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: emailParam, 
                otpCode: code, 
                newPassword: newPassword, 
                confirmPassword: confirmPassword 
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                alert('Đổi mật khẩu thành công!');
                window.location.href = '/auth/login';
            } else {
                alert('Lỗi: ' + data.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        })
        .catch(err => {
            alert('Lỗi hệ thống');
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    });
  </script>
</body>
</html>
