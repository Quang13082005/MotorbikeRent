spring.application.name=motorbike-rental

# =============================================
# DATABASE - MySQL (Production/Default)
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/motorent_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
# SERVER
# =============================================
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =============================================
# LOGGING
# =============================================
logging.level.com.motorrent.motorbikerental=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# SPRING AI (disable by default, enable in production)
# =============================================
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder-not-required-in-preview}
spring.ai.openai.chat.enabled=false

# =============================================
# MAIL - GMAIL CONFIGURATION
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============================================
# APP CUSTOM PROPERTIES
# =============================================
app.jwt.secret=${JWT_SECRET:motorent-danang-secret-key-2024-very-long-secure-key}
app.jwt.expiration=86400000
app.upload.dir=uploads/
app.preview.mode=false

logging.file.name=${LOG_FILE:spring.log}

# =============================================
# GOOGLE CLOUD VISION API KEY (OCR)
# =============================================
google.cloud.vision.api-key=${GOOGLE_VISION_API_KEY:}

# =============================================
# PAYOS CONFIGURATION
# =============================================
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# Account image uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.seed-demo=false
